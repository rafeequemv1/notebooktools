<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;family=Google+Sans+Text:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <title>Import to NotebookLM</title>
    <link rel="stylesheet" href="shared.css">
  </head>
  <body>
    <main class="app embedded nt-panel">
      <section class="card">
        <header class="ntp-head">
          <img src="icons/icon16.png" alt="" width="18" height="18">
          <div class="ntp-head-copy">
            <p class="import-header-title ntp-title">Send to NotebookLM</p>
            <p id="videoTitle" class="ntp-meta">YouTube video</p>
          </div>
        </header>

        <span class="ntp-label">Add to</span>
        <input id="notebookSearch" type="search" placeholder="Search notebooks" autocomplete="off" aria-label="Search notebooks">
        <select id="notebookLmSelect" aria-label="Notebook">
          <option value="">Loading notebooks...</option>
        </select>
        <input id="newNotebookLmName" type="text" placeholder="Or create a new notebook" aria-label="New notebook name">

        <div id="studioOptions" class="studio-options" hidden>
          <label for="studioArtifactType">Also create in Studio</label>
          <select id="studioArtifactType" aria-label="Studio output type"></select>
          <label class="embedded-toggle" for="studioOpenTabToggle">
            <input type="checkbox" id="studioOpenTabToggle" checked>
            <span class="embedded-toggle-ui" aria-hidden="true"></span>
            <span class="embedded-toggle-text">Open notebook in new tab</span>
          </label>
        </div>

        <button class="button ntp-primary" id="importButton" type="button">Send to notebook</button>

        <div class="ntp-foot">
          <button class="text-button" id="refreshButton" type="button">Refresh list</button>
          <a class="text-button" id="openNotebookLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open notebook</a>
        </div>

        <div class="status" id="status" role="status"></div>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="stats.js"></script>
    <script src="notebooklm-client.js"></script>
    <script src="nlm-bridge.js"></script>
    <script src="settings.js"></script>
    <script src="studio-import.js"></script>
    <script src="notebook-picker.js"></script>
    <script src="youtube-import.js"></script>
  </body>
</html>
