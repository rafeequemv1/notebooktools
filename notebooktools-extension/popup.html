<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>NotebookTools</title>
    <link rel="stylesheet" href="popup.css">
    <script src="theme.js"></script>
  </head>
  <body>
    <main class="qp">
      <header class="qp-head">
        <img class="qp-logo" src="logo.png" alt="NotebookTools" height="14">
        <button type="button" class="qp-icon" id="openPanel" title="Open the full panel (Bulk, Snapshots, Prompts)" aria-label="Open the full panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg>
        </button>
      </header>

      <section class="qp-page" id="pageCard">
        <img class="qp-favicon" id="pageIcon" alt="" width="18" height="18" hidden>
        <div class="qp-page-text">
          <p class="qp-kind" id="pageKind">Current page</p>
          <p class="qp-title" id="pageTitle">Loading…</p>
        </div>
      </section>

      <label class="qp-label" for="notebookSelect">Notebook</label>
      <div class="qp-row">
        <select id="notebookSelect" class="qp-select" aria-label="Notebook"><option value="">Loading notebooks…</option></select>
        <button type="button" class="qp-icon qp-new" id="toggleNew" title="New notebook" aria-label="New notebook" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <input id="newNotebookName" class="qp-input" type="text" placeholder="New notebook name" maxlength="120" hidden>

      <button type="button" class="qp-primary" id="addButton" disabled>Add to notebook</button>
      <p class="qp-status" id="status" role="status" aria-live="polite"></p>

      <nav class="qp-links" aria-label="More">
        <button type="button" class="qp-link" data-panel="bulk">Bulk import</button>
        <span aria-hidden="true">·</span>
        <button type="button" class="qp-link" id="openHub">All notebooks</button>
        <span aria-hidden="true">·</span>
        <button type="button" class="qp-link" data-panel="import">Full panel</button>
      </nav>
    </main>

    <script src="utils.js"></script>
    <script src="notebooklm-client.js"></script>
    <script src="notebook-picker.js"></script>
    <script src="stats.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
