<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;family=Google+Sans+Text:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <title>NotebookTools</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="prompt-library.css">
    <link rel="stylesheet" href="bulk-import.css">
    <link rel="stylesheet" href="snapshots.css">
  </head>
  <body class="sidepanel-body">
    <main class="sidepanel-app">
      <header class="sidepanel-header">
        <div class="sidepanel-header-row">
          <img class="sidepanel-logo" src="logo.png" alt="NotebookTools" width="132" height="16">
          <div class="sidepanel-header-actions">
            <button type="button" class="header-icon-btn" id="openNotebooksButton" title="All notebooks" aria-label="All notebooks">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3.5 9.5h17M9.5 9.5v10" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <span class="sp-account-slot" id="accountChipSlot"></span>
            <button type="button" class="header-icon-btn settings-btn" data-open-settings title="Settings" aria-label="Settings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <p class="sidepanel-tagline" id="pageContext" hidden>Import to NotebookLM</p>
        <div hidden id="spAutoOpenHolder">
          <label class="sp-switch" title="Open the notebook after importing">
            <input type="checkbox" id="autoOpenNotebookToggle">
            <span class="sp-switch-ui" aria-hidden="true"></span>
            <span>Open notebook after import</span>
          </label>
        </div>
      </header>

      <nav class="sidepanel-tabs" role="tablist" aria-label="NotebookTools panels">
        <button class="sidepanel-tab is-active" id="tabImport" type="button" role="tab" aria-selected="true" aria-controls="panelImport" data-panel="import" data-i18n="tabImport">Import</button>
        <button class="sidepanel-tab" id="tabBulk" type="button" role="tab" aria-selected="false" aria-controls="panelBulk" data-panel="bulk" data-i18n="tabBulk">Bulk</button>
        <button class="sidepanel-tab" id="tabSnapshots" type="button" role="tab" aria-selected="false" aria-controls="panelSnapshots" data-panel="snapshots">Snapshots</button>
        <button class="sidepanel-tab" id="tabPrompts" type="button" role="tab" aria-selected="false" aria-controls="panelPrompts" data-panel="prompts" data-i18n="tabPrompts">Prompts</button>
      </nav>

      <div class="sp-target" id="spTarget" aria-label="Destination notebook"></div>

      <section class="sidepanel-panel is-active" id="panelImport" role="tabpanel" aria-labelledby="tabImport">
        <div class="sp-stack">
          <section class="sp-card sp-source">
            <div class="import-modes" role="tablist" aria-label="Import type">
              <button class="import-mode is-active" id="modeWebpage" type="button" data-mode="webpage">Web</button>
              <button class="import-mode" id="modeYouTube" type="button" data-mode="youtube">YouTube</button>
              <button class="import-mode" id="modeText" type="button" data-mode="text" hidden>Text</button>
            </div>
            <p class="source-preview" id="sourcePreview">Current tab</p>
          </section>

          <details class="youtube-batch-panel" id="youtubeBatchPanel" hidden>
            <summary class="youtube-batch-summary">
              <span class="youtube-batch-summary-title" id="youtubeBatchTitle">Playlist</span>
              <span class="youtube-batch-summary-meta" id="youtubeBatchMeta"></span>
            </summary>
            <div class="youtube-batch-tools">
              <button type="button" class="youtube-batch-tool" id="youtubeBatchSelectAll">All</button>
              <button type="button" class="youtube-batch-tool" id="youtubeBatchSelectNone">None</button>
              <button type="button" class="youtube-batch-tool" id="youtubeBatchReload">Reload</button>
            </div>
            <div class="youtube-batch-list" id="youtubeBatchList"></div>
            <p class="youtube-batch-selected" id="youtubeBatchSelected"></p>
          </details>

          <section class="sp-card sp-destination">
            <h2 class="sp-label">Notebook</h2>
            <div class="sp-fields">
              <input id="notebookSearch" type="search" placeholder="Search notebooks" autocomplete="off" aria-label="Search notebooks">
              <select id="notebookLmSelect" aria-label="Notebook">
                <option value="">Loading notebooks...</option>
              </select>
              <input id="newNotebookLmName" type="text" placeholder="Or create new notebook" aria-label="New notebook name">
            </div>
          </section>

          <p class="source-limit-note" id="importLimitNote" hidden></p>

          <section class="sp-card sp-studio" id="studioSection" hidden>
            <details class="sp-more">
            <summary class="sp-more-summary">Also create in Studio</summary>
            <p class="sp-studio-hint">Import this page and create a Studio output in one go.</p>
            <label class="sp-field-label" for="studioArtifactType">Create</label>
            <select id="studioArtifactType" aria-label="Studio output type"></select>
            <label class="embedded-toggle sp-studio-toggle" for="studioOpenTabToggle">
              <input type="checkbox" id="studioOpenTabToggle" checked>
              <span class="embedded-toggle-ui" aria-hidden="true"></span>
              <span class="embedded-toggle-text">Open notebook in new tab</span>
            </label>
            <button class="button secondary sp-studio-btn" id="studioButton" type="button">Create mind map</button>
            </details>
          </section>

          <button class="button sp-primary" id="importButton" type="button">Add to notebook</button>

          <div class="sp-actions">
            <button class="text-button" id="refreshNotebookLmButton" type="button">Refresh</button>
            <a class="text-button" id="openNotebookLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open notebook</a>
          </div>

          <div class="status" id="status" role="status"></div>
        </div>
      </section>

      <section class="sidepanel-panel" id="panelBulk" role="tabpanel" aria-labelledby="tabBulk" hidden>
        <div id="bulkImportRoot"></div>
      </section>

      <section class="sidepanel-panel" id="panelSnapshots" role="tabpanel" aria-labelledby="tabSnapshots" hidden>
        <div id="snapshotsPanelRoot"></div>
      </section>

      <section class="sidepanel-panel" id="panelPrompts" role="tabpanel" aria-labelledby="tabPrompts" hidden>
        <div id="promptLibraryRoot"></div>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="notebooklm-client.js"></script>
    <script src="settings.js"></script>
    <script src="studio-import.js"></script>
    <script src="i18n.js"></script>
    <script src="settings-ui.js"></script>
    <script src="source-limits.js"></script>
    <script src="notebook-picker.js"></script>
    <script src="youtube-collector.js"></script>
    <script src="bulk-queue-store.js"></script>
    <script src="bulk-import-runner.js"></script>
    <script src="link-extract.js"></script>
    <script src="youtube-batch-preview.js"></script>
    <script src="prompt-library-data.js"></script>
    <script src="custom-prompts.js"></script>
    <script src="prompt-library.js"></script>
    <script src="bulk-import.js"></script>
    <script src="snapshot-store.js"></script>
    <script src="vendor/pdf-lib/pdf-lib.min.js"></script>
    <script src="workflows/snapshots/snapshot-upload.js"></script>
    <script src="workflows/snapshots/snapshot-pdf.js"></script>
    <script src="snapshots-panel.js"></script>
    <script src="account.js"></script>
    <script src="account-ui.js"></script>
    <script src="sidepanel.js"></script>
    <script src="sidepanel-target.js"></script>
      <script src="dev-reload.js"></script>
  </body>
</html>
