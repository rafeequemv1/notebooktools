<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;family=Google+Sans+Text:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <title>Import to NotebookLM</title>
    <link rel="stylesheet" href="shared.css">
  </head>
  <body>
    <main class="app embedded">
      <section class="card">
        <div class="brand">
          <span class="atlas-logo brand-logo" role="img" aria-label="Atlas for Gemini Notebook"><img src="icons/atlas-mark.svg" alt="" width="20" height="20"><b>Atlas</b><span>for Gemini Notebook</span></span>
          <p id="sourceTitle" class="video-title">Conversation</p>
        </div>

        <p class="source-preview" id="sourcePreview">Ready to import</p>

        <label for="notebookLmSelect">Notebook</label>
        <select id="notebookLmSelect">
          <option value="">Loading notebooks...</option>
        </select>

        <p class="field-divider">or create new</p>

        <input id="newNotebookLmName" type="text" placeholder="Notebook name" aria-label="New notebook name">

        <button class="button" id="importButton" type="button">Import</button>

        <div class="footer-row">
          <button class="text-button" id="refreshButton" type="button">Refresh list</button>
        </div>

        <div class="status" id="status" role="status"></div>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="notebooklm-client.js"></script>
    <script src="platform-import.js"></script>
  </body>
</html>
