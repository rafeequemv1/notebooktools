<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&amp;family=Google+Sans+Text:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <title>Send to NotebookLM</title>
    <link rel="stylesheet" href="shared.css">
  </head>
  <body>
    <main class="app embedded nt-panel">
      <section class="card">
        <header class="ntp-head">
          <img src="icons/icon16.png" alt="" width="18" height="18">
          <div class="ntp-head-copy">
            <p id="sourceTitle" class="ntp-title">Conversation</p>
            <p class="ntp-meta" id="sourcePreview">Ready to send</p>
          </div>
        </header>
        <p class="source-note" id="sourceNote" hidden></p>
        <span class="ntp-label">Add to</span>
        <select id="notebookLmSelect" aria-label="Notebook">
          <option value="">Loading notebooks...</option>
        </select>
        <input id="newNotebookLmName" type="text" placeholder="Or create a new notebook" aria-label="New notebook name">
        <button class="button ntp-primary" id="importButton" type="button">Send to notebook</button>
        <div class="ntp-foot">
          <button class="text-button" id="refreshButton" type="button">Refresh list</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </section>
    </main>

    <script src="utils.js"></script>
    <script src="stats.js"></script>
    <script src="notebooklm-client.js"></script>
    <script src="nlm-bridge.js"></script>
    <script src="platform-import.js"></script>
  </body>
</html>
